# DQN (stable-baselines3). Hyperparameters are common defaults, fixed BEFORE the 2010 test split was
# evaluated and not tuned afterwards. Same sample budget as Q-learning: 3000 episodes x 168 steps.
name: dqn
algo: dqn
seeds: [42, 43, 44, 45, 46]
total_timesteps: 504000
reward_scale: 0.1
demand_ref_quantile: 0.95
eval_every: 25200
eval_episodes: 20
hyperparameters:
  learning_rate: 0.001
  buffer_size: 100000
  learning_starts: 2000
  batch_size: 64
  gamma: 0.95
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 1000
  exploration_fraction: 0.3     # epsilon falls from 1.0 to the final value over this share of training
  exploration_final_eps: 0.05
  net_arch: [64, 64]
