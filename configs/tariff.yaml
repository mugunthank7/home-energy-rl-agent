# SIMULATED time-of-use tariff. Not a real utility's prices.
currency: USD
prices_per_kwh:
  off_peak: 0.08   # 22:00-06:00
  mid_peak: 0.15   # all other hours
  on_peak: 0.30    # 16:00-21:00 weekdays
off_peak_hours: [22, 23, 0, 1, 2, 3, 4, 5]
on_peak_hours: [16, 17, 18, 19, 20]
on_peak_weekdays_only: true
demand_charge_per_kw: 5.0   # on the highest hourly grid import in the episode
